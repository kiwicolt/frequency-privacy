name: Build Relish APK

on:
  push:
    paths:
      - "relish/**"
      - ".github/workflows/relish-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "relish-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: relish-apk
          path: relish/relish-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: relish-build-${{ github.run_number }}
          name: Relish build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: relish/relish-${{ github.run_number }}.apk
          body: |
            Debug-signed APK of Relish built from ${{ github.sha }}.
            Install: download the .apk on your phone, allow "Install unknown apps" for your browser/file manager, and open it.
