name: Build Relish APK

on:
  push:
    paths:
      - "relish/**"
      - ".github/workflows/relish-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK at $ANDROID_HOME; just accept licenses.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # Release = R8-optimised and non-debuggable: much smoother Compose scrolling than debug.
      - name: Build release + debug APKs and run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease assembleDebug testDebugUnitTest 2>&1 | tee build.log

      # Surface compiler/KSP errors at the end of the log, where they're easy to find.
      - name: Show build errors
        if: failure()
        run: |
          grep -nE '^e: |Compilation error|FAILED' build.log | head -80 || true

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk "relish-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "relish-${{ github.run_number }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: relish-apk
          path: relish/relish-${{ github.run_number }}*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: relish-build-${{ github.run_number }}
          name: Relish build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            relish/relish-${{ github.run_number }}.apk
            relish/relish-${{ github.run_number }}-debug.apk
          body: |
            Relish built from ${{ github.sha }}.
            relish-${{ github.run_number }}.apk: optimised release build (install this one).
            relish-${{ github.run_number }}-debug.apk: unoptimised fallback, only if the release build misbehaves.
            Install: download the .apk on your phone, allow "Install unknown apps" for your browser/file manager, and open it.
